site_name: DotProlog
site_description: A Prolog language implementation for .NET 10, written in C# 14.
repo_name: kidoz/dotprolog
repo_url: https://github.com/kidoz/dotprolog
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: obj/docs

theme:
  name: mkdocs
  locale: en
  color_mode: auto
  user_color_mode_toggle: true
  navigation_depth: 3
  highlightjs: true
  hljs_languages:
    - csharp
    - fsharp
    - prolog
    - xml
    - yaml

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Language guide: language-guide.md
  - Source linting: linting.md
  - Book:
      - Introduction: book/index.md
      - 1. Getting ready: book/01-getting-ready.md
      - 2. Facts and questions: book/02-facts-and-questions.md
      - 3. Rules: book/03-rules.md
      - 4. Unification and search: book/04-unification-and-search.md
      - 5. Recursion: book/05-recursion.md
      - 6. Lists: book/06-lists.md
      - 7. Numbers and arithmetic: book/07-numbers-and-arithmetic.md
      - 8. Making decisions: book/08-making-decisions.md
      - 9. Collecting answers: book/09-collecting-answers.md
      - 10. Words and text: book/10-words-and-text.md
      - 11. Project, a text adventure: book/11-project-text-adventure.md
      - 12. Prolog meets .NET: book/12-prolog-meets-dotnet.md
      - На русском:
          - Введение: book/ru/index.md
          - 1. Подготовка: book/ru/01-getting-ready.md
          - 2. Факты и вопросы: book/ru/02-facts-and-questions.md
          - 3. Правила: book/ru/03-rules.md
          - 4. Унификация и поиск: book/ru/04-unification-and-search.md
          - 5. Рекурсия: book/ru/05-recursion.md
          - 6. Списки: book/ru/06-lists.md
          - 7. Числа и арифметика: book/ru/07-numbers-and-arithmetic.md
          - 8. Принятие решений: book/ru/08-making-decisions.md
          - 9. Сбор ответов: book/ru/09-collecting-answers.md
          - 10. Слова и текст: book/ru/10-words-and-text.md
          - 11. Проект, текстовый квест: book/ru/11-project-text-adventure.md
          - 12. Пролог и .NET: book/ru/12-prolog-meets-dotnet.md
  - .NET integration: dotnet-integration.md
  - Architecture: architecture/index.md
  - Reference:
      - ISO processor characteristics: reference/iso-processor-characteristics.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
