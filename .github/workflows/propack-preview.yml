name: Propack preview

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Integration/**'
      - 'tests/fixtures/packages/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/propack-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Integration/**'
      - 'tests/fixtures/packages/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/propack-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  preview:
    name: Install and run ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev swi-prolog-nox
      - name: Install macOS SWI-Prolog
        if: runner.os == 'macOS'
        run: brew install swi-prolog
      - name: Install Windows SWI-Prolog
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install swi-prolog --yes --no-progress
          'C:\Program Files\swipl\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Record toolchain versions
        run: |
          python --version
          dotnet --version
          swipl --version
      - name: Build preview artifacts
        run: >-
          python tests/Integration/prepare-propack-preview.py
          --rid ${{ matrix.rid }} --version 0.17.0-preview.1
          --output artifacts/propack-preview
      - name: Install and verify both artifacts with the pinned external library
        run: >-
          dotnet test --project tests/Integration --no-ansi --
          --filter-class Integration.Tests.PropackPreviewTests
        env:
          DOTPROLOG_RUN_PACKAGE_PREVIEW_TESTS: '1'
          DOTPROLOG_PREVIEW_ARTIFACTS: artifacts/propack-preview
      - name: Upload verified preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: propack-preview-${{ matrix.rid }}
          path: artifacts/propack-preview/*
          if-no-files-found: error
