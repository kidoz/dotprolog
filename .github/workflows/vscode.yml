name: VS Code extension

on:
  pull_request:
    paths: ['src/**', 'tests/DotProlog.VSCode.Tests/**', 'tests/Integration/verify-language-server.py', 'Directory.Build.props', 'global.json', '.gitattributes', '.editorconfig', '.prettierrc.json', '.prettierignore', '.github/workflows/vscode.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/DotProlog.VSCode.Tests/**', 'tests/Integration/verify-language-server.py', 'Directory.Build.props', 'global.json', '.gitattributes', '.editorconfig', '.prettierrc.json', '.prettierignore', '.github/workflows/vscode.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package-preview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: [minimum, stable]
        package: [managed, native]
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
          - os: macos-latest
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/DotProlog.VSCode
    env:
      DOTNET_NOLOGO: true
      MSBUILDDISABLENODEREUSE: '1'
      DOTPROLOG_EXTENSION_PATH: ${{ github.workspace }}/src/DotProlog.VSCode/bin/installed/extension
      VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/DotProlog.VSCode/package-lock.json
      - run: npm ci
      - name: NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux' && matrix.package == 'native'
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev
      - run: npm run format:check
      - run: npm test
      - run: npm run package -- ${{ matrix.package == 'native' && matrix.target || '' }}
      - name: Install and verify the VSIX
        run: npm run test:install -- ${{ matrix.package == 'native' && matrix.target || '' }}
      - name: Editor integration (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Editor integration
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Restricted Mode (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:restricted
      - name: Restricted Mode
        if: runner.os != 'Linux'
        run: npm run test:restricted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotprolog-vscode-${{ matrix.package }}-${{ runner.os }}-${{ matrix.vscode }}
          path: src/DotProlog.VSCode/bin/*.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.package == 'native'
        with:
          name: dotprolog-vscode-symbols-${{ runner.os }}-${{ matrix.vscode }}
          path: |
            src/DotProlog.VSCode/bin/server/*.dbg
            src/DotProlog.VSCode/bin/server/*.pdb
            src/DotProlog.VSCode/bin/server/*.dSYM/**
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: dotprolog-vscode-logs-${{ matrix.package }}-${{ runner.os }}-${{ matrix.vscode }}
          path: |
            src/DotProlog.VSCode/bin/last-editor-run/profile/logs
            src/DotProlog.VSCode/bin/installed/profile/logs
