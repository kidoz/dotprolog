name: VS Code extension

on:
  pull_request:
    paths: ['src/**', 'tests/DotProlog.VSCode.Tests/**', 'Directory.Build.props', 'global.json', '.github/workflows/vscode.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/DotProlog.VSCode.Tests/**', 'Directory.Build.props', 'global.json', '.github/workflows/vscode.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-preview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/DotProlog.VSCode
    env:
      DOTNET_NOLOGO: true
      MSBUILDDISABLENODEREUSE: '1'
      DOTPROLOG_EXTENSION_PATH: ${{ github.workspace }}/src/DotProlog.VSCode/bin/installed/extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/DotProlog.VSCode/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run package
      - name: Extract the VSIX for consumer tests
        run: python -m zipfile -e bin/dotprolog-0.1.0.vsix bin/installed
      - name: Editor integration (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Editor integration
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Restricted Mode (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:restricted
      - name: Restricted Mode
        if: runner.os != 'Linux'
        run: npm run test:restricted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotprolog-vscode-${{ runner.os }}
          path: src/DotProlog.VSCode/bin/*.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: dotprolog-vscode-logs-${{ runner.os }}
          path: src/DotProlog.VSCode/bin/last-editor-run/profile/logs
