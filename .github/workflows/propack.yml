name: Propack release

on:
  push:
    branches: [main]
    tags: ['propack-v*']
    paths:
      - 'src/**'
      - 'tests/Integration/**'
      - 'tests/fixtures/packages/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/propack.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Integration/**'
      - 'tests/fixtures/packages/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/propack.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  verify:
    name: Install and run ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev swi-prolog-nox
      - name: Install macOS SWI-Prolog
        if: runner.os == 'macOS'
        run: brew install swi-prolog
      - name: Install Windows SWI-Prolog
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install swi-prolog --yes --no-progress
          'C:\Program Files\swipl\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Record toolchain versions
        run: |
          python --version
          dotnet --version
          swipl --version
      - name: Check stable version and tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYVERSION'
          import os, xml.etree.ElementTree as ET
          version = ET.parse('src/DotProlog.Packages.Cli/Version.props').findtext('.//PropackVersion')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('version=' + version + '\n')
          if os.environ['RELEASE_TAG'].startswith('propack-v'):
              assert os.environ['RELEASE_TAG'] == 'propack-v' + version
          PYVERSION
      - name: Test release asset collection
        run: python tests/Integration/test_propack_release.py
      - name: Build release artifacts
        run: >-
          python tests/Integration/prepare-propack-release.py
          --rid ${{ matrix.rid }} --version ${{ steps.version.outputs.version }}
          --output artifacts/propack-release
      - name: Install and verify both artifacts with the pinned external library
        run: >-
          dotnet test --project tests/Integration --no-ansi --
          --filter-class Integration.Tests.PropackReleaseTests
        env:
          DOTPROLOG_RUN_PACKAGE_RELEASE_TESTS: '1'
          DOTPROLOG_RELEASE_ARTIFACTS: artifacts/propack-release
      - name: Upload verified release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: propack-release-${{ matrix.rid }}
          path: artifacts/propack-release/*
          if-no-files-found: error

  release:
    name: Publish stable propack release
    if: startsWith(github.ref, 'refs/tags/propack-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: propack-release-*
          path: downloaded
      - name: Collect validated release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#propack-v}"
          python tests/Integration/collect-propack-release.py --version "$version" --input downloaded --output release-artifacts
      - name: Software bill of materials
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          version="${RELEASE_TAG#propack-v}"
          Version="$version" dotnet CycloneDX src/DotProlog.Packages.Cli/DotProlog.Packages.Cli.csproj -o release-artifacts --filename sbom.json --json
          cd release-artifacts
          sha256sum *.nupkg *.zip sbom.json > SHA256SUMS
      - name: Create GitHub release and start NuGet publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#propack-v}"
          python tests/Integration/collect-propack-release.py --version "$version" --output release-artifacts --verify
          gh release create "$RELEASE_TAG" --verify-tag --title "propack $version" --notes-file "docs/releases/propack-$version.md" release-artifacts/*
          gh workflow run release.yml --ref main -f product=propack -f version="$version"
