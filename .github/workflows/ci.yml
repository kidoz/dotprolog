name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: microsoft/setup-msbuild@v2
        if: matrix.os == 'windows-latest'

      # NativeAOT links with the platform toolchain. Windows and macOS runners already carry one.
      - name: Install NativeAOT prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

      - name: Restore tools
        run: dotnet tool restore

      # One platform is enough: formatting is platform-independent, and .gitattributes pins line endings.
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet csharpier check .

      # MSBuild loads the facade generator as a task while building the .dplproj sample, so the task
      # assembly has to exist before the solution build reaches that project.
      - name: Build the facade generator task
        run: dotnet build src/DotProlog.Build.Tasks -c Release -p:ContinuousIntegrationBuild=true

      # ContinuousIntegrationBuild makes the build deterministic and Source Link paths correct. It is
      # deliberately not set in Directory.Build.props, where it would break debugging a working tree.
      - name: Build
        run: dotnet build DotProlog.slnx -c Release -p:ContinuousIntegrationBuild=true

      # DOTPROLOG_RUN_AOT_TESTS opts in to the NativeAOT acceptance test, which publishes the sample
      # as a native executable and runs it. It is skipped by default because it takes tens of seconds.
      - name: Test
        run: dotnet test --solution DotProlog.slnx -c Release --no-build --no-ansi
        env:
          DOTPROLOG_RUN_AOT_TESTS: '1'
          DOTPROLOG_RUN_FULL_MSBUILD_TESTS: '1'

      # One platform inventories every independently maintained ISO case at its pinned revision and
      # executes the mechanically supported wrapper slice. Exact counts prevent upstream drift or
      # incomplete accounting from hiding while the remaining wrappers are adapted.
      - name: Run independent ISO conformance slice
        if: matrix.os == 'ubuntu-latest'
        run: >-
          dotnet test tests/Integration/Integration.Tests.csproj
          -c Release --no-build --no-ansi --
          --filter-class Integration.Tests.LogtalkConformanceTests
        env:
          DOTPROLOG_RUN_EXTERNAL_CONFORMANCE_TESTS: '1'
          DOTPROLOG_LOGTALK_REPORT_PATH: 'artifacts/logtalk-iso-conformance.json'

      # Every release platform proves its NativeAOT tool subpackage. The portable package and
      # pointer are present too, so one-shot execution also exercises .NET 10's RID selection.
      - name: Pack and execute the current platform tool
        shell: bash
        run: |
          dotnet pack src/DotProlog.Tool -c Release -r "${{ matrix.rid }}" \
            -o artifacts -p:ContinuousIntegrationBuild=true
          dotnet pack src/DotProlog.Tool -c Release -r any \
            -o artifacts -p:ContinuousIntegrationBuild=true
          dotnet pack src/DotProlog.Tool -c Release \
            -o artifacts -p:ContinuousIntegrationBuild=true
          version=$(grep -oE '<VersionPrefix>[^<]+' Directory.Build.props | cut -d'>' -f2)
          test -f "artifacts/DotProlog.Tool.${{ matrix.rid }}.$version.nupkg"
          test -f "artifacts/DotProlog.Tool.any.$version.nupkg"
          dotnet tool exec --source artifacts "DotProlog.Tool@$version" \
            run samples/HelloProlog/hello.pl |
            grep -Fx "Hello! World!"

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack DotProlog.slnx -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true

      - name: Test packed templates and tool
        if: matrix.os == 'ubuntu-latest'
        run: tests/Integration/verify-packages.sh artifacts linux-x64

      - name: Software bill of materials
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet CycloneDX DotProlog.slnx -o artifacts --filename sbom.json --json

      # A consumer can check every uploaded package artifact without trusting the download path.
      - name: Checksums
        if: matrix.os == 'ubuntu-latest'
        run: cd artifacts && sha256sum *.nupkg *.snupkg sbom.json > SHA256SUMS

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error
