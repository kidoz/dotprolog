name: Release

# Publishing is deliberate: it happens when a version tag is pushed, and the push is a human act.
# Nothing here runs on a branch.
on:
  push:
    tags: ['v*']
  # A version whose GitHub release succeeded but whose packages never reached the feed can be
  # finished from here, without re-tagging: a re-run would replay the workflow file as it existed
  # at the tag, so a fix landing later on main would not apply. Only the publish job runs.
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish to nuget.org, for example 0.2.0
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Reused MSBuild worker nodes outlive their build step and keep task assemblies such as
  # DotProlog.Build.Tasks loaded, which blocks later copies to those outputs on Windows.
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  # The same gates CI applies, re-run against the tagged commit rather than trusted from a branch.
  verify:
    name: Verify ${{ matrix.os }}
    # Skipping this cascades through native, package, and release, so a manual run reaches only
    # the publish job.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform's flake must not cancel its siblings mid-run; a cancelled hung job is what
      # left the 0.1.0 release without native binaries.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: microsoft/setup-msbuild@v2
        if: matrix.os == 'windows-latest'

      - name: Install NativeAOT prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet csharpier check .

      - name: Build the facade generator task
        run: dotnet build src/DotProlog.Build.Tasks -c Release -p:ContinuousIntegrationBuild=true

      - name: Build
        run: dotnet build DotProlog.slnx -c Release -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test --solution DotProlog.slnx -c Release --no-build --no-ansi
        env:
          DOTPROLOG_RUN_AOT_TESTS: '1'
          DOTPROLOG_RUN_COMPILED_CONFORMANCE_TESTS: '1'
          DOTPROLOG_RUN_FULL_MSBUILD_TESTS: '1'

      # The tag has to agree with what the projects say they are, or the packages would carry a
      # version nobody chose.
      - name: Check the tag matches VersionPrefix
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -oE '<VersionPrefix>[^<]+' Directory.Build.props | cut -d'>' -f2)
          echo "tag=$tag declared=$declared"
          test "$tag" = "$declared"

  # A published binary anyone can download and run without installing .NET.
  native:
    name: Native ${{ matrix.rid }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install NativeAOT prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

      - name: Publish the sample natively
        run: >
          dotnet publish samples/AotAcceptance/AotAcceptance.csproj
          -c Release -r ${{ matrix.rid }} -p:PublishAot=true
          -p:ContinuousIntegrationBuild=true -o native/${{ matrix.rid }}

      - name: Pack the NativeAOT tool
        run: >
          dotnet pack src/DotProlog.Tool -c Release -r ${{ matrix.rid }}
          -p:ContinuousIntegrationBuild=true -o tool-package

      - name: Name the binary after its platform
        shell: bash
        run: |
          cd native/${{ matrix.rid }}
          rm -rf ./*.dSYM ./*.pdb
          if [ -f AotAcceptance.exe ]; then
            mv AotAcceptance.exe "../../dotprolog-sample-${{ matrix.rid }}.exe"
          else
            mv AotAcceptance "../../dotprolog-sample-${{ matrix.rid }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: dotprolog-sample-*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: tool-${{ matrix.rid }}
          path: tool-package/*.nupkg
          if-no-files-found: error

  package:
    name: Package
    needs: [verify, native]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          pattern: tool-*
          path: artifacts
          merge-multiple: true

      - name: Pack the portable tool fallback
        run: >
          dotnet pack src/DotProlog.Tool -c Release -r any
          -o artifacts -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: dotnet pack DotProlog.slnx -c Release -o artifacts -p:ContinuousIntegrationBuild=true

      - name: Test packed templates and tool
        run: tests/Integration/verify-packages.sh artifacts linux-x64

      - name: Software bill of materials
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet CycloneDX DotProlog.slnx -o artifacts --filename sbom.json --json

      - name: Checksums
        run: cd artifacts && sha256sum *.nupkg *.snupkg sbom.json > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [native, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: downloaded/packages

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: downloaded

      - name: Checksum every release asset
        shell: bash
        run: |
          find downloaded/packages downloaded/native-* -type f ! -name SHA256SUMS -print0 |
            sort -z |
            while IFS= read -r -d '' file; do
              digest=$(sha256sum "$file" | cut -d' ' -f1)
              printf '%s  %s\n' "$digest" "$(basename "$file")"
            done > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS

      # The changelog is the source of the notes, so the two cannot disagree.
      - name: Extract the notes for this version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside && /^\[[^]]+\]: / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            downloaded/packages/*.nupkg
            downloaded/packages/*.snupkg
            downloaded/packages/sbom.json
            downloaded/native-*/*
            SHA256SUMS
          fail_on_unmatched_files: true

  # Separated so that publishing to nuget.org is its own approval gate: configure the `release`
  # environment with required reviewers and nothing reaches the feed without a person saying so.
  publish:
    name: Publish to NuGet
    needs: release
    # always() keeps this reachable on a manual run, where every build job above is skipped.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    # A job-level block replaces the workflow-level one, so contents has to be restated. Trusted
    # publishing exchanges this OIDC token for a short-lived nuget.org key; without id-token the
    # login step cannot run at all.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: github.event_name == 'push'
        with:
          name: packages
          path: artifacts

      # A manual run publishes the packages already attached to that version's GitHub release,
      # which are the same files the tag run built and checksummed. The symbol packages have to
      # come down too: only the .nupkg files are pushed, and each one carries its .snupkg along
      # from the same directory.
      - name: Download the release packages
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "v${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.nupkg' --pattern '*.snupkg' --dir artifacts
          ls artifacts

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Kept immediately before the push: the issued key is short-lived, and each OIDC token can
      # be exchanged only once.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          # The nuget.org profile name, not an email address. Kept in a secret so it is masked.
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Trusted publishing did not return an API key."
            exit 1
          fi
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(grep -oE '<VersionPrefix>[^<]+' Directory.Build.props | cut -d'>' -f2)
          fi
          pointer="DotProlog.Tool.$version.nupkg"

          # Only the .nupkg files are pushed: each carries its adjacent .snupkg with it, and
          # pushing symbols separately collides with the copy still being validated. There is no
          # --skip-duplicate either, because a version that is already on the feed must fail
          # loudly rather than report success having shipped nothing.
          find artifacts -maxdepth 1 -name '*.nupkg' ! -name "$pointer" -print0 |
            sort -z |
            while IFS= read -r -d '' package; do
              dotnet nuget push "$package" \
                --source https://api.nuget.org/v3/index.json \
                --api-key "$NUGET_API_KEY"
            done

          # The pointer references the RID subpackages, so it must become visible last.
          dotnet nuget push "artifacts/$pointer" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"
